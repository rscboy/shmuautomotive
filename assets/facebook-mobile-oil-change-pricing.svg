<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title desc">
  <title id="title">Shmu's Automotive mobile oil change pricing graphic</title>
  <desc id="desc">A square Facebook post graphic promoting Shmu's Automotive mobile oil changes in Dayton, Ohio, with service prices and booking phone number.</desc>
  <defs>
    <pattern id="diagonal-lines" width="36" height="36" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="36" height="36" fill="#ffffff"/>
      <rect width="7" height="36" fill="#f0f0f0"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="12" dy="12" stdDeviation="0" flood-color="#000000" flood-opacity="1"/>
    </filter>
    <style>
      .font { font-family: Inter, Arial, Helvetica, sans-serif; }
      .heavy { font-weight: 900; }
      .bold { font-weight: 800; }
      .medium { font-weight: 600; }
      .smallcaps { letter-spacing: 4px; text-transform: uppercase; }
    </style>
  </defs>

  <rect width="1080" height="1080" fill="url(#diagonal-lines)"/>
  <rect x="36" y="36" width="1008" height="1008" fill="#ffffff" stroke="#000000" stroke-width="10"/>

  <g class="font">
    <!-- Brand header -->
    <rect x="72" y="68" width="936" height="150" fill="#000000"/>
    <text x="104" y="134" fill="#ffffff" font-size="46" class="heavy smallcaps">Shmu's Automotive</text>
    <text x="104" y="181" fill="#ffffff" font-size="22" class="bold smallcaps">Dayton, OH • 50-mile radius</text>
    <g transform="translate(838 92)">
      <circle cx="56" cy="56" r="54" fill="#ffffff"/>
      <path d="M28 65h57c11 0 19 8 19 18v8H88v-7c0-4-3-7-7-7H35c-4 0-7 3-7 7v7H12v-8c0-10 8-18 16-18Z" fill="#000000"/>
      <path d="M29 62l12-25c4-8 11-13 20-13h23c9 0 16 5 20 13l12 25H29Z" fill="#000000"/>
      <circle cx="38" cy="90" r="9" fill="#000000"/>
      <circle cx="94" cy="90" r="9" fill="#000000"/>
      <path d="M48 43h47l6 13H42l6-13Z" fill="#ffffff"/>
      <path d="M61 18h16v27H61z" fill="#000000"/>
      <path d="M54 26h31v10H54z" fill="#000000"/>
    </g>

    <!-- Main message -->
    <text x="72" y="306" fill="#000000" font-size="78" class="heavy">MOBILE OIL</text>
    <text x="72" y="386" fill="#000000" font-size="78" class="heavy">CHANGES</text>
    <rect x="72" y="410" width="508" height="46" fill="#000000"/>
    <text x="94" y="441" fill="#ffffff" font-size="24" class="bold smallcaps">We come to your driveway</text>
    <text x="72" y="504" fill="#000000" font-size="32" class="bold">No waiting rooms. No upsells.</text>
    <text x="72" y="548" fill="#000000" font-size="32" class="bold">Done in about 30 minutes.</text>

    <!-- Price card -->
    <g filter="url(#shadow)">
      <rect x="604" y="282" width="404" height="514" fill="#ffffff" stroke="#000000" stroke-width="8"/>
      <rect x="604" y="282" width="404" height="82" fill="#000000"/>
      <text x="806" y="335" text-anchor="middle" fill="#ffffff" font-size="31" class="heavy smallcaps">The Lube Ledger</text>

      <text x="638" y="420" fill="#000000" font-size="28" class="heavy">Full Synthetic</text>
      <text x="976" y="420" text-anchor="end" fill="#000000" font-size="40" class="heavy">$70</text>
      <line x1="638" x2="976" y1="446" y2="446" stroke="#000000" stroke-width="3" opacity="0.16"/>

      <text x="638" y="502" fill="#000000" font-size="28" class="heavy">High Mileage</text>
      <text x="976" y="502" text-anchor="end" fill="#000000" font-size="40" class="heavy">$70</text>
      <line x1="638" x2="976" y1="528" y2="528" stroke="#000000" stroke-width="3" opacity="0.16"/>

      <text x="638" y="584" fill="#000000" font-size="28" class="heavy">Advanced Synthetic</text>
      <text x="976" y="584" text-anchor="end" fill="#000000" font-size="40" class="heavy">$80</text>
      <line x1="638" x2="976" y1="610" y2="610" stroke="#000000" stroke-width="3" opacity="0.16"/>

      <rect x="628" y="632" width="356" height="78" fill="#000000"/>
      <text x="648" y="663" fill="#ffffff" font-size="20" class="bold">Restore &amp; Protect</text>
      <text x="648" y="692" fill="#ffffff" font-size="17" class="medium smallcaps">Shmu Recommended</text>
      <text x="966" y="685" text-anchor="end" fill="#ffffff" font-size="40" class="heavy">$90</text>

      <text x="638" y="758" fill="#000000" font-size="24" class="bold">Includes up to 5 quarts</text>
      <text x="638" y="787" fill="#000000" font-size="24" class="bold">+ premium filter</text>
    </g>

    <!-- Add-ons strip -->
    <g>
      <rect x="72" y="690" width="484" height="172" fill="#ffffff" stroke="#000000" stroke-width="8"/>
      <rect x="72" y="690" width="484" height="52" fill="#000000"/>
      <text x="314" y="725" text-anchor="middle" fill="#ffffff" font-size="24" class="heavy smallcaps">Easy Add-ons</text>
      <text x="106" y="790" fill="#000000" font-size="30" class="heavy">Tire Rotation</text>
      <text x="522" y="790" text-anchor="end" fill="#000000" font-size="38" class="heavy">$25</text>
      <text x="106" y="834" fill="#000000" font-size="30" class="heavy">Air &amp; Cabin Filters</text>
      <text x="522" y="834" text-anchor="end" fill="#000000" font-size="38" class="heavy">$20</text>
    </g>

    <!-- Footer CTA -->
    <rect x="72" y="900" width="936" height="104" fill="#000000"/>
    <text x="540" y="944" text-anchor="middle" fill="#ffffff" font-size="28" class="bold smallcaps">Book your driveway oil change</text>
    <text x="540" y="984" text-anchor="middle" fill="#ffffff" font-size="42" class="heavy">Call or Text 937-367-7089</text>
  </g>
</svg>
